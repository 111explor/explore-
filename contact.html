<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>صفحاتنا | Explor Plus</title>
  <meta name="description" content="كل صفحات وحسابات وأرقام Explor Plus للدعاية والإعلان بمكان واحد: إنستغرام، واتساب، وكل فروعنا.">
  <meta name="theme-color" content="#f5faff">
  <link rel="canonical" href="https://explorplus.online/contact.html">
  <meta property="og:title" content="صفحاتنا | Explor Plus">
  <meta property="og:description" content="كل صفحاتنا وحساباتنا وأرقامنا بمكان واحد.">
  <meta property="og:image" content="https://explorplus.online/assets/og-image.jpg">
  <link rel="icon" href="assets/icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;500;600;700;800&family=Alexandria:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* نفس ثيم الموقع الرئيسي (التصميم 2: كريمي + بنفسجي ← برتقالي) */
    :root {
      --bg: #f5faff; --surface: #ffffff; --tint-1: #e7f3ff; --tint-2: #eef4fa;
      --text: #0b0b14; --muted: #55637a; --border: rgba(10,132,255,.14);
      --accent: #0a84ff; --accent-2: #0369a1;
      --grad: linear-gradient(115deg, #0a84ff 0%, #2aa6f5 50%, #5cc8fb 100%);
      color-scheme: light;
    }
    * { box-sizing: border-box; margin: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Cairo', 'IBM Plex Sans Arabic', system-ui, sans-serif; line-height: 1.7; }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(640px, 100%); margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)); }

    /* الهيدر: نفس الموقع */
    header.top { position: sticky; top: 0; z-index: 50; background: rgba(245,250,255,.88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
    .nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 66px; }
    .brand { display: flex; align-items: center; gap: 10px; font-family: 'Alexandria', 'Cairo', sans-serif; font-weight: 700; }
    .brand img { width: 44px; height: auto; }
    .brand span { line-height: 1.2; }
    .brand small { display: block; font-family: 'Cairo', sans-serif; font-size: 11.5px; color: var(--muted); font-weight: 500; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 9px 18px; border-radius: 999px; font-weight: 700; font-size: 14.5px; white-space: nowrap; background: #0b0b14; color: #fff; box-shadow: 0 12px 30px -14px rgba(11,11,20,.6); }
    .btn svg { width: 16px; height: 16px; }
    .btn:focus-visible, .link:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    /* الواجهة: شريط متدرّج بزوايا مدوّرة تحت، زي الموقع */
    .hero { background: var(--grad); color: #fff; border-radius: 0 0 40px 40px; padding: 34px 0 44px; text-align: center; }
    .pill { display: inline-flex; align-items: center; gap: 8px; background: #fff; color: var(--muted); border-radius: 999px; padding: 4px 4px 4px 14px; font-size: 13.5px; font-weight: 600; }
    .pill b { background: var(--grad); color: #fff; border-radius: 999px; padding: 3px 12px; font-weight: 700; }
    h1 { font-family: 'Lalezar', 'Cairo', sans-serif; font-weight: 400; font-size: clamp(48px, 13vw, 76px); line-height: 1.15; margin-top: 14px; }
    .lead { color: #e6f6ff; font-size: 16.5px; font-weight: 500; max-width: 36ch; margin: 4px auto 0; }
    .hours { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; background: rgba(11,11,20,.92); color: #fff; padding: 7px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; }
    .hours i { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,.22); }
    .hours.off i { background: #7dd3fc; box-shadow: 0 0 0 4px rgba(255,179,125,.25); }

    /* الأزرار: كروت زي كروت الخدمات بالموقع */
    .eyebrow { display: inline-block; background: var(--tint-1); color: var(--accent); padding: 4px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; margin: 28px 0 12px; }
    .links { list-style: none; padding: 0; display: grid; gap: 12px; }
    .link { display: flex; align-items: center; gap: 14px; min-height: 78px; padding: 13px 16px; background: var(--surface); border: 2px solid var(--border); border-radius: 26px; transition: transform .15s ease, border-color .2s ease; }
    .links li:nth-child(3n+2) .link { background: var(--tint-1); border-color: transparent; }
    .links li:nth-child(3n) .link { background: var(--tint-2); border-color: transparent; }
    .link:hover { transform: translateY(-2px); border-color: var(--accent); }
    .link:active { transform: scale(.985); }
    .ico { flex: none; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: #fff; box-shadow: 0 8px 18px -12px rgba(11,11,20,.35); }
    .ico svg { width: 26px; height: 26px; }
    .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .txt b { font-size: 17.5px; font-weight: 800; line-height: 1.35; }
    .txt span { font-size: 14px; color: var(--muted); font-weight: 500; overflow-wrap: anywhere; }
    .links li:nth-child(3n) .txt span { color: #334155; }
    .go { flex: none; width: 36px; height: 36px; border-radius: 50%; background: #fff; color: var(--accent); display: grid; place-items: center; }
    .go svg { width: 18px; height: 18px; transform: scaleX(-1); }
    .link.featured { background: #0b0b14 !important; color: #fff; border-color: #0b0b14 !important; }
    .link.featured .txt span { color: #b6c3d6 !important; }
    .link.featured .ico { background: rgba(255,255,255,.1); box-shadow: none; color: #fff !important; }
    .link.featured .go { background: rgba(255,255,255,.1); color: #7dd3fc; }
    .skel { height: 78px; border-radius: 26px; background: var(--tint-1); }

    /* الفوتر: زي الموقع */
    footer { border-top: 1px solid var(--border); margin-top: 40px; padding: 24px 0 calc(28px + env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: 14px; }
    .foot { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .foot .brand { font-size: 15px; color: var(--text); }
    .foot .brand img { width: 36px; }
    .foot nav { display: flex; gap: 16px; flex-wrap: wrap; }
    .foot nav a:hover { color: var(--text); }
    @media (prefers-reduced-motion: reduce) { .link { transition: none; } }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap nav">
      <a href="./" class="brand" aria-label="Explor Plus"><img src="assets/logo-dark.png" alt=""><span>Explor Plus<small>للدعاية والإعلان</small></span></a>
      <a href="./" class="btn">الموقع الرئيسي <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <span class="pill"><b>Explor Plus</b><span>منذ 2018</span></span>
        <h1>صفحاتنا</h1>
        <p class="lead">كل صفحاتنا وحساباتنا وأرقامنا بمكان واحد. اختار الفرع اللي بدك ياه.</p>
        <span class="hours" id="hours"><i aria-hidden="true"></i><span id="hoursTxt">يومياً 10AM–10PM</span></span>
      </div>
    </section>

    <div class="wrap">
      <span class="eyebrow">تابعنا وتواصل معنا</span>
      <ul class="links" id="links" aria-label="صفحاتنا">
        <li class="skel"></li><li class="skel"></li><li class="skel"></li>
      </ul>
    </div>
  </main>

  <footer>
    <div class="wrap foot">
      <a href="./" class="brand"><img src="assets/logo-dark.png" alt=""><span>Explor Plus<small>© <span id="year">2026</span> · جميع الحقوق محفوظة</small></span></a>
      <nav aria-label="روابط"><a href="./">الموقع الرئيسي</a><a href="./#services">خدماتنا</a><a href="terms.html">الشروط والخصوصية</a></nav>
    </div>
  </footer>

  <script src="assets/vendor/supabase-2.118.0.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/store-core.js"></script>
  <script src="assets/links.js"></script>
  <script>
  (function () {
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    // @يوزر وأرقام بالإنجليزي جوّا نص عربي: منعزلهم عشان ما ينقلبوا
    const bidi = (raw) => String(raw).split(/([@+]?[A-Za-z0-9][\w.@+-]*)/).map((part, i) => i % 2 ? `<bdi dir="ltr">${esc(part)}</bdi>` : esc(part)).join('');
    const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

    function render(list) {
      const { ICONS, toHref } = window.XPLinks;
      const storeOff = (window.EXPLOR_CONFIG || {}).STORE_OPEN === false;
      const items = (list || []).filter((l) => l && l.title && toHref(l.type, l.value) && !(storeOff && (l.type === 'store' || /\/store/.test(String(l.value)))));
      document.getElementById('links').innerHTML = items.map((l, i) => {
        const ic = ICONS[l.type] || ICONS.link;
        const href = toHref(l.type, l.value);
        const ext = /^https?:/.test(href) ? ' target="_blank" rel="noopener"' : '';
        return `<li><a class="link${l.featured ? ' featured' : ''}" href="${esc(href)}"${ext}>
          <span class="ico" style="color:${esc(l.color || ic.color)}">${ic.svg}</span>
          <span class="txt"><b>${bidi(l.title)}</b>${l.sub ? `<span>${bidi(l.sub)}</span>` : ''}</span>
          <span class="go">${ARROW}</span></a></li>`;
      }).join('') || '<li class="link"><span class="txt"><b>راسلنا على واتساب</b></span></li>';
    }

    function openNow() {
      let h; try { h = Number(new Intl.DateTimeFormat('en-GB', { hour: 'numeric', hourCycle: 'h23', timeZone: 'Asia/Hebron' }).format(new Date())); } catch (e) { h = new Date().getHours(); }
      const open = h >= 10 && h < 22;
      document.getElementById('hours').classList.toggle('off', !open);
      document.getElementById('hoursTxt').textContent = open ? 'متواجدين الآن · يومياً 10AM–10PM' : 'يومياً 10AM–10PM · بنرد عليك أول ما نفتح';
    }
    openNow();
    document.getElementById('year').textContent = new Date().getFullYear();

    const C = window.EXPLOR_CONFIG || {};
    // أول إشي: الأزرار الافتراضية، بعدين اللي رتّبه الأدمن من لوحة الإدارة
    render(window.XPLinks.defaults(C));
    if (window.XP && XP.configured) {
      XP.loadSiteConfig().then((cfg) => {
        render(Array.isArray(cfg.CONTACT_LINKS) && cfg.CONTACT_LINKS.length ? cfg.CONTACT_LINKS : window.XPLinks.defaults(cfg));
      });
      XP.trackVisits('/contact');
    }
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  })();
  </script>
</body>
</html>

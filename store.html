<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر Explor Plus</title>
  <meta name="description" content="اشحن رصيدك واشترِ اشتراكاتك الرقمية وخدمات Explor Plus واستلمها فوراً.">
  <meta name="theme-color" content="#07080b">
  <link rel="icon" href="assets/icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Explor Plus">

  <link rel="canonical" href="https://explorplus.online/store.html">
  <meta property="og:title" content="متجر Explor Plus: اشتراكات رقمية بتسليم فوري">
  <meta property="og:description" content="اشحن رصيدك واشترِ اشتراكاتك الرقمية واستلمها فوراً، مع خصومات للعملاء الدائمين.">
  <meta property="og:image" content="https://explorplus.online/assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/store.css">
</head>
<body>
  <header class="top">
    <div class="wrap bar">
      <a class="brand" href="index.html"><img src="assets/logo-light.png" alt=""><span>Explor Plus<small>المتجر</small></span></a>
      <div class="bar-actions">
        <button class="bell" id="bellBtn" type="button" aria-label="الإشعارات" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="count" id="bellCount" hidden></span></button>
        <a class="balance-chip" href="#wallet" id="balanceChip" hidden><span class="hide-sm">الرصيد</span> <b class="num" id="balanceVal">0</b></a>
        <button class="btn btn-ghost btn-sm" id="installBtn" type="button" hidden>📲 ثبّت التطبيق</button>
        <a class="btn btn-primary btn-sm" href="#login" id="loginBtn">تسجيل الدخول</a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button" hidden>خروج</button>
      </div>
    </div>
    <nav class="wrap tabs" aria-label="المتجر">
      <a class="tab" href="#shop" data-route="shop">المتجر</a>
      <a class="tab" href="#wallet" data-route="wallet">محفظتي</a>
      <a class="tab" href="#orders" data-route="orders" data-orders-filter="all">طلباتي</a>
      <a class="tab" href="index.html">الموقع الرئيسي</a>
    </nav>
  </header>

  <main class="wrap" id="app"><div class="spinner"></div></main>

  <script src="assets/vendor/supabase-2.118.0.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/store-core.js"></script>
  <script>
  (function () {
    const { C, sb, configured, $, $$, esc, normPhone, validPhone, money, fmtDate, waLink, errMsg, toast, copy, pill, TX_KIND, setupNotice, getProfile, signIn, signUp } = XP;
    const app = $('#app');
    let me = null;            // profile
    let products = [];
    let stock = {};
    let filter = 'all';
    let pendingBuy = null;    // product id to resume after login

    const MARK = 'assets/logo-light.png';
    const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    const WA_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>';
    const waFor = (p) => (p && p.category === 'service') ? C.WA_SERVICES : C.WA_SUBSCRIPTIONS;

    if (!configured) { setupNotice(app); return; }

    /* ---------- data ---------- */
    let summary = null;   // رصيد، مصروف، عمليات، مستوى الامتياز
    let tiers = [];
    const pct = (n) => `${Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 })}%`;
    const myDiscount = () => Number((summary && summary.discount_pct) || 0);
    const priceFor = (p) => Math.round(Number(p.price) * (100 - myDiscount())) / 100;
    async function loadSummary() {
      summary = null;
      if (!me) return;
      const { data } = await sb.rpc('my_summary');
      summary = (data && data[0]) || null;
    }
    async function loadTiers() {
      if (tiers.length) return;
      const { data } = await sb.from('loyalty_tiers').select('*').order('min_spent');
      tiers = data || [];
    }

    async function refreshMe() {
      try { me = await getProfile(); } catch (e) { me = null; }
      await loadSummary();
      $('#balanceChip').hidden = !me; $('#logoutBtn').hidden = !me; $('#loginBtn').hidden = !!me;
      if (!me) $('#bellBtn').hidden = true; else loadNotes();
      if (me) $('#balanceVal').textContent = money(me.balance);
    }
    async function loadProducts() {
      const [{ data: p, error }, { data: s }] = await Promise.all([
        sb.from('products').select('*').eq('active', true).order('sort').order('id'),
        sb.rpc('product_stock')
      ]);
      if (error) throw error;
      products = p || [];
      stock = Object.fromEntries((s || []).map((r) => [r.product_id, Number(r.available)]));
    }

    /* ---------- router ---------- */
    async function route() {
      let r = (location.hash || '#shop').slice(1);
      const buyMatch = r.match(/^buy-(\d+)$/);
      if (buyMatch) {
        // جاي من الصفحة الرئيسية بزر «اطلب»: بنفتح المتجر، وإذا مش مسجّل بنحوّله للدخول وبنكمّل بعدها
        history.replaceState(null, '', location.pathname + location.search + '#shop');
        r = 'shop';
        pendingBuy = Number(buyMatch[1]);
      }
      $$('[data-route]').forEach((a) => { if (a.dataset.route === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
      if ((r === 'wallet' || r === 'orders') && !me) { location.hash = '#login'; return; }
      app.innerHTML = '<div class="spinner"></div>';
      try {
        if (r === 'login') return renderAuth();
        if (r === 'wallet') return await renderWallet();
        if (r === 'orders') return await renderOrders();
        await renderShop();
        if (pendingBuy) { const id = pendingBuy; if (me) pendingBuy = null; openBuy(id); }
        return;
      } catch (e) { app.innerHTML = `<div class="empty">${esc(errMsg(e))}</div>`; }
    }

    /* ---------- shop ---------- */
    function stockBadge(p) {
      if (p.delivery === 'manual') return '<span class="badge info">تنفيذ خلال وقت قصير</span>';
      const n = stock[p.id] || 0;
      if (n <= 0) return '<span class="badge bad">نفدت الكمية</span>';
      if (n <= 3) return `<span class="badge warn">🔥 باقي ${n} بس · تسليم فوري</span>`;
      return `<span class="badge ok">متوفر ${n} · تسليم فوري</span>`;
    }
    async function renderShop() {
      await loadProducts();
      let expiring = [];
      if (me) {
        const soon = new Date(Date.now() + 3 * 86400000).toISOString(), past = new Date(Date.now() - 7 * 86400000).toISOString();
        const { data } = await sb.from('orders').select('id, product_id, product_name, expires_at').eq('status', 'delivered').gte('expires_at', past).lte('expires_at', soon);
        expiring = (data || []).filter((o) => products.some((p) => p.id === o.product_id));
      }
      await Promise.all([loadTiers(), me ? loadSummary() : null]);
      const list = products.filter((p) => filter === 'all' || p.category === filter);
      app.innerHTML = `
        ${XP.announcements.map((a) => `<div class="offer-banner"><div><b>🎁 ${esc(a.title)}</b>${a.body ? `<span>${esc(a.body)}</span>` : ''}</div>${a.link ? `<a class="btn btn-sm btn-primary" href="${esc(a.link)}"${/^https?:/.test(a.link) ? ' target="_blank" rel="noopener"' : ''}>شوف العرض</a>` : ''}</div>`).join('')}
        ${me && summary ? dashboard() : guestPanel()}
        ${expiring.map((o) => { const n = daysLeft(o.expires_at); return `<div class="renew-banner"><span>⏰ <b>${esc(o.product_name)}</b> ${n < 0 ? 'انتهى' : n === 0 ? 'بينتهي اليوم' : `بينتهي بعد ${daysWord(n)}`}</span><button class="btn btn-primary btn-sm" data-buy="${o.product_id}">جدّد الآن</button></div>`; }).join('')}
        <div class="chips" role="group" aria-label="التصنيف">
          <button class="chip" data-filter="all" aria-pressed="${filter === 'all'}">الكل</button>
          <button class="chip" data-filter="subscription" aria-pressed="${filter === 'subscription'}">اشتراكات رقمية</button>
          <button class="chip" data-filter="service" aria-pressed="${filter === 'service'}">خدمات</button>
        </div>
        ${list.length ? `<div class="products">${list.map((p) => {
          const out = p.delivery === 'auto' && !(stock[p.id] > 0);
          return `<article class="product">
            <div class="product-media ${p.image_url ? 'has-img' : ''}">${p.image_url ? `<img class="cover" src="${esc(p.image_url)}" alt="" loading="lazy">` : `<img class="mark" src="${MARK}" alt="">`}</div>
            <div class="product-body">
              <div class="spread"><h3>${esc(p.name)}</h3>${p.duration ? `<span class="badge">${esc(p.duration)}</span>` : ''}</div>
              ${p.description ? `<p>${esc(p.description)}</p>` : '<p></p>'}
              <div>${stockBadge(p)}</div>
              <div class="spread">
                ${myDiscount() > 0 ? `<div class="price num">${money(priceFor(p))} <s class="was">${money(p.price)}</s></div>` : `<div class="price num">${money(p.price)}</div>`}
                <button class="btn btn-primary btn-sm" data-buy="${p.id}" ${out ? 'disabled' : ''}>${out ? 'نفدت' : 'اشترِ الآن'}</button>
              </div>
            </div>
          </article>`; }).join('')}</div>` : '<div class="empty">ما في منتجات بهالقسم حالياً.</div>'}`;
    }

    function dashboard() {
      const sm = summary, spent = Number(sm.total_spent), next = sm.next_min_spent ? Number(sm.next_min_spent) : null;
      const prevMin = sm.tier_name ? Number((tiers.find((t) => t.name === sm.tier_name) || {}).min_spent || 0) : 0;
      const progress = next ? Math.max(4, Math.min(100, ((spent - prevMin) / (next - prevMin)) * 100)) : 100;
      return `
        <section class="dash" aria-label="حسابي">
          <div class="dash-hello"><h1>أهلاً ${esc(me.full_name)} 👋</h1>${sm.tier_name ? `<span class="tier-badge">⭐ عضو ${esc(sm.tier_name)} · خصم ${pct(sm.discount_pct)}</span>` : ''}</div>
          <div class="dash-grid">
            <div class="dash-card dash-balance">
              <span class="muted small">رصيدك</span>
              <b class="num">${money(sm.balance)}</b>
              <a class="btn btn-primary" href="#wallet">+ شحن رصيد</a>
            </div>
            <a class="dash-card" href="#orders" data-orders-filter="delivered">
              <span class="muted small">عمليات مكتملة</span>
              <b class="num">${sm.completed_count}</b>
              <span class="small dash-link">عرض العمليات ←</span>
            </a>
            <div class="dash-card">
              <span class="muted small">مجموع مشترياتك عنا</span>
              <b class="num">${money(spent)}</b>
              ${Number(sm.pending_count) ? `<a class="small dash-link" href="#orders" data-orders-filter="pending">${sm.pending_count} قيد التنفيذ ←</a>` : '<span class="small muted">شكراً لثقتك 💙</span>'}
            </div>
          </div>
          ${tiers.length ? `<div class="loyalty">
            <div class="spread small"><span>${next ? `باقيلك <b class="num">${money(next - spent)}</b> وبتصير عضو <b>${esc(sm.next_tier_name)}</b> بخصم <b>${pct(sm.next_discount_pct)}</b>` : `🏆 وصلت لأعلى مستوى! خصم ${pct(sm.discount_pct)} على كل شي`}</span><button class="linkish" type="button" data-show-tiers>كيف بتشتغل الامتيازات؟</button></div>
            <div class="bar-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(progress)}"><i style="width:${progress}%"></i></div>
          </div>` : ''}
        </section>`;
    }
    function guestPanel() {
      return `
        <div class="page-head"><div><h1>المتجر</h1><p>اشحن رصيدك مرة وحدة، واشترِ واستلم اشتراكك فوراً.</p></div><a class="btn btn-primary" href="#login">سجّل دخول / حساب جديد</a></div>
        ${tiers.length ? `<div class="loyalty guest"><span>⭐ <b>امتيازات Explor Plus:</b> ${tiers.map((t) => `خصم ${pct(t.discount_pct)} لما تصرف ${money(t.min_spent)}`).join('، ')}.</span></div>` : ''}`;
    }
    function showTiers() {
      const spent = summary ? Number(summary.total_spent) : 0;
      openSheet(`
        <div class="spread"><h2>⭐ امتيازات Explor Plus</h2><button class="btn btn-ghost btn-sm" data-close>إغلاق</button></div>
        <p class="muted">كل ما تشتري أكثر، بتوفّر أكثر. الخصم بينطبق تلقائياً على كل مشترياتك لما توصل للمستوى.</p>
        <div>${tiers.map((t) => `<div class="kv"><span>${spent >= Number(t.min_spent) ? '✅' : '⬜'} عضو <b>${esc(t.name)}</b> · لما تصرف ${money(t.min_spent)}</span><b>خصم ${pct(t.discount_pct)}</b></div>`).join('')}</div>
        ${summary ? `<p class="small muted">مجموع مشترياتك لهلأ: <b class="num">${money(spent)}</b></p>` : ''}`);
    }

    function closeSheet() { const s = $('.sheet-bg'); if (s) s.remove(); }
    function openSheet(html) {
      closeSheet();
      const bg = document.createElement('div'); bg.className = 'sheet-bg';
      bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
      bg.addEventListener('click', (e) => { if (e.target === bg || e.target.closest('[data-close]')) closeSheet(); });
      document.body.appendChild(bg);
      return bg.firstElementChild;
    }

    function openBuy(id) {
      const p = products.find((x) => x.id === Number(id));
      if (!p) return;
      if (!me) { pendingBuy = p.id; toast('سجّل دخول أو اعمل حساب لتكمل الشراء'); location.hash = '#login'; return; }
      const disc = myDiscount(), final = priceFor(p);
      const enough = Number(me.balance) >= final;
      const el = openSheet(`
        <div class="spread"><h2>تأكيد الشراء</h2><button class="btn btn-ghost btn-sm" data-close>إغلاق</button></div>
        <div>
          <div class="kv"><span>المنتج</span><b>${esc(p.name)}${p.duration ? ' · ' + esc(p.duration) : ''}</b></div>
          <div class="kv"><span>السعر</span><b class="num">${money(p.price)}</b></div>
          ${disc > 0 ? `<div class="kv"><span>⭐ خصم الامتياز (${pct(disc)})</span><b class="num" style="color:var(--ok)">-${money(Number(p.price) - final)}</b></div><div class="kv"><span>السعر بعد الخصم</span><b class="num">${money(final)}</b></div>` : ''}
          <div class="kv"><span>رصيدك الحالي</span><b class="num">${money(me.balance)}</b></div>
          <div class="kv"><span>رصيدك بعد الشراء</span><b class="num" style="color:${enough ? 'var(--ok)' : 'var(--bad)'}">${money(me.balance - final)}</b></div>
        </div>
        ${p.delivery === 'manual' ? `<div class="field"><label for="buyNote">رابط صفحتك أو أي تفاصيل بنحتاجها</label><textarea id="buyNote" rows="3" placeholder="مثلاً: instagram.com/mypage"></textarea></div>` : ''}
        <p class="form-msg err" id="buyErr" hidden></p>
        ${enough
          ? `<button class="btn btn-primary btn-block" id="confirmBuy">ادفع ${money(final)} من رصيدك</button>`
          : `<p class="form-msg err">رصيدك ما بيكفي. ناقصك ${money(final - me.balance)}.</p><a class="btn btn-primary btn-block" href="#wallet" data-close>اشحن رصيدك</a>`}
      `);
      const btn = $('#confirmBuy', el);
      if (btn) btn.addEventListener('click', async () => {
        btn.disabled = true; btn.textContent = 'جاري الشراء…';
        const note = $('#buyNote', el) ? $('#buyNote', el).value : null;
        const { data: o, error } = await sb.rpc('purchase', { p_product_id: p.id, p_note: note });
        if (error) { const m = $('#buyErr', el); m.textContent = errMsg(error); m.hidden = false; btn.disabled = false; btn.textContent = 'جرّب كمان مرة'; return; }
        await refreshMe();
        showResult(o, p);
        if ((location.hash || '#shop') === '#shop') renderShop();
      });
    }

    function secretBox(text) {
      return `<div class="secret"><code>${esc(text)}</code><button class="btn btn-ghost btn-sm" data-copy="${esc(text)}" aria-label="نسخ">${COPY_ICON}</button></div>`;
    }

    function showResult(o, p) {
      const msg = `مرحباً Explor Plus 👋\nطلب رقم #${o.id}\nالمنتج: ${o.product_name}\nالحالة: ${o.status === 'delivered' ? 'تم التسليم' : 'قيد التنفيذ'}`;
      openSheet(o.status === 'delivered' ? `
        <h2>✅ تم الشراء والتسليم</h2>
        <p class="muted">هاي بيانات ${esc(o.product_name)}. احفظها بمكان آمن، وبتلاقيها كمان بصفحة "طلباتي".</p>
        ${secretBox(o.delivered_content)}
        <div class="row"><a class="btn btn-ghost" href="#orders" data-close>طلباتي</a><a class="btn btn-wa" target="_blank" rel="noopener" href="${waLink(waFor(p), msg)}">${WA_ICON} مساعدة</a></div>
      ` : `
        <h2>🕐 استلمنا طلبك #${o.id}</h2>
        <p class="muted">انخصم ${money(o.price)} من رصيدك وطلبك صار عند الفريق. بس يخلص بيظهرلك بصفحة "طلباتي". لتسريع الطلب ابعتلنا رسالة:</p>
        <a class="btn btn-wa btn-block" target="_blank" rel="noopener" href="${waLink(waFor(p), msg)}">${WA_ICON} أرسل رقم الطلب على واتساب</a>
        <a class="btn btn-ghost btn-block" href="#orders" data-close>طلباتي</a>
      `);
    }

    /* ---------- auth ---------- */
    // mode: login | signup | verify | forgot | reset
    let authEmail = '';
    function renderAuth(mode = 'login') {
      if (me && mode !== 'reset') { location.hash = '#shop'; return; }
      const tabs = (mode === 'login' || mode === 'signup') ? `
          <div class="switch" role="group">
            <button type="button" data-mode="login" aria-pressed="${mode === 'login'}">تسجيل الدخول</button>
            <button type="button" data-mode="signup" aria-pressed="${mode === 'signup'}">حساب جديد</button>
          </div>` : '';
      let body = '';
      if (mode === 'login') body = `
            <div class="field"><label for="aId">الإيميل</label><input id="aId" type="email" inputmode="email" autocomplete="username" required placeholder="name@gmail.com" dir="ltr"></div>
            <div class="field"><label for="aPass">كلمة السر</label><input id="aPass" type="password" autocomplete="current-password" required minlength="6" dir="ltr"></div>
            <p class="form-msg err" id="authErr" hidden></p>
            <button class="btn btn-primary btn-block" type="submit">دخول</button>
            <a class="small muted" style="text-align:center" target="_blank" rel="noopener" href="${waLink(C.WA_SUBSCRIPTIONS, 'مرحباً، نسيت كلمة السر لحسابي بالمتجر. إيميلي: ')}">نسيت كلمة السر؟ راسلنا على واتساب</a>`;
      if (mode === 'signup') body = `
            <div class="field"><label for="aName">الاسم</label><input id="aName" autocomplete="name" required placeholder="اسمك أو اسم صفحتك"></div>
            <div class="field"><label for="aEmail">الإيميل</label><input id="aEmail" type="email" inputmode="email" autocomplete="email" required placeholder="name@gmail.com" dir="ltr"><span class="hint">بتدخل فيه على حسابك.</span></div>
            <div class="field"><label for="aPhone">رقم الجوال (واتساب)</label><input id="aPhone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="059xxxxxxx" dir="ltr"><span class="hint">لحتى نتواصل معك بخصوص طلباتك.</span></div>
            <div class="field"><label for="aPass">كلمة السر</label><input id="aPass" type="password" autocomplete="new-password" required minlength="6" placeholder="6 أحرف أو أكثر" dir="ltr"></div>
            <label class="check small"><input type="checkbox" id="aTerms"> <span>موافق على <a href="terms.html" target="_blank" rel="noopener" style="color:var(--accent)">الشروط وسياسة الاسترجاع والخصوصية</a></span></label>
            <p class="form-msg err" id="authErr" hidden></p>
            <button class="btn btn-primary btn-block" type="submit">إنشاء الحساب</button>`;
      if (mode === 'verify') body = `
            <h2 style="font-size:20px">✉️ أكّد إيميلك</h2>
            <p class="muted small">${authEmail ? `بعتنا رمز على <b dir="ltr">${esc(authEmail)}</b>. شوف كمان مجلد الرسائل غير المرغوب فيها (Spam).` : 'دخّل إيميلك والرمز اللي وصلك.'}</p>
            <div class="field" ${authEmail ? 'hidden' : ''}><label for="aEmail">الإيميل</label><input id="aEmail" type="email" inputmode="email" autocomplete="email" dir="ltr" value="${esc(authEmail)}"></div>
            <div class="field"><label for="aCode">رمز التأكيد</label><input id="aCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" dir="ltr" class="code-input" placeholder="••••••"></div>
            <p class="form-msg err" id="authErr" hidden></p>
            <button class="btn btn-primary btn-block" type="submit">تأكيد</button>
            <div class="spread small"><button class="linkish" type="button" id="resendBtn">ابعتلي رمز جديد</button><button class="linkish" type="button" data-mode="login">رجوع</button></div>`;
      if (mode === 'forgot') body = `
            <h2 style="font-size:20px">🔑 نسيت كلمة السر</h2>
            <p class="muted small">اكتب إيميلك وبنبعتلك رمز لتعمل كلمة سر جديدة.</p>
            <div class="field"><label for="aEmail">الإيميل</label><input id="aEmail" type="email" inputmode="email" autocomplete="email" dir="ltr" value="${esc(authEmail)}"></div>
            <p class="form-msg err" id="authErr" hidden></p>
            <button class="btn btn-primary btn-block" type="submit">ابعتلي الرمز</button>
            <div class="spread small"><a class="linkish" target="_blank" rel="noopener" href="${waLink(C.WA_SUBSCRIPTIONS, 'مرحباً، نسيت كلمة السر لحسابي بالمتجر ومش واصلني رمز. رقمي: ')}">ما وصلني إشي؟ راسلنا</a><button class="linkish" type="button" data-mode="login">رجوع</button></div>`;
      if (mode === 'reset') body = `
            <h2 style="font-size:20px">🔑 كلمة سر جديدة</h2>
            <p class="muted small">بعتنا رمز على <b dir="ltr">${esc(authEmail)}</b>.</p>
            <div class="field"><label for="aCode">الرمز</label><input id="aCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" dir="ltr" class="code-input" placeholder="••••••"></div>
            <div class="field"><label for="aPass">كلمة السر الجديدة</label><input id="aPass" type="password" autocomplete="new-password" minlength="6" dir="ltr"></div>
            <p class="form-msg err" id="authErr" hidden></p>
            <button class="btn btn-primary btn-block" type="submit">حفظ والدخول</button>
            <div class="spread small"><button class="linkish" type="button" data-mode="forgot">ابعتلي رمز جديد</button><button class="linkish" type="button" data-mode="login">رجوع</button></div>`;
      app.innerHTML = `<div class="auth card">${tabs}<form class="stack" id="authForm" novalidate>${body}</form></div>`;
      $$('[data-mode]', app).forEach((b) => b.addEventListener('click', () => renderAuth(b.dataset.mode)));
      const first = app.querySelector('input:not([hidden]):not([type=checkbox])'); if (first && mode !== 'login') first.focus();
      const showErr = (m) => { const e = $('#authErr'); e.textContent = m; e.hidden = false; };
      const done = async (msg) => {
        await refreshMe(); toast(msg); location.hash = '#shop';
        if (pendingBuy) { const id = pendingBuy; pendingBuy = null; setTimeout(() => openBuy(id), 400); }
        else route();
      };
      const rb = $('#resendBtn');
      if (rb) rb.addEventListener('click', async () => {
        const em = authEmail || ($('#aEmail') && $('#aEmail').value.trim());
        if (!XP.isEmail(em)) return showErr('اكتب إيميلك أول.');
        try { await XP.resendCode(em); toast('بعتنالك رمز جديد ✉️'); } catch (ex) { showErr(errMsg(ex)); }
      });
      $('#authForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type=submit]'); $('#authErr').hidden = true;
        const val = (id) => ($('#' + id) ? $('#' + id).value.trim() : '');
        try {
          if (mode === 'login') {
            const id = val('aId'), pass = $('#aPass').value;
            if (!XP.isEmail(id) && !validPhone(id)) return showErr('اكتب إيميلك صح.');
            if (pass.length < 6) return showErr('كلمة السر لازم تكون 6 أحرف أو أكثر.');
            btn.disabled = true;
            try { await signIn(id, pass); }
            catch (ex) { if (/Email not confirmed/.test(ex.message || '') && XP.isEmail(id)) { authEmail = id.toLowerCase(); try { await XP.resendCode(authEmail); } catch (x) {} return renderAuth('verify'); } throw ex; }
            return await done('أهلاً فيك من جديد');
          }
          if (mode === 'signup') {
            const name = val('aName'), email = val('aEmail'), phone = val('aPhone'), pass = $('#aPass').value;
            if (!name) return showErr('اكتب اسمك.');
            if (!XP.isEmail(email)) return showErr('اكتب إيميل صحيح، مثلاً name@gmail.com.');
            if (!validPhone(phone)) return showErr('اكتب رقم جوال صحيح، مثلاً 0597653989.');
            if (pass.length < 6) return showErr('كلمة السر لازم تكون 6 أحرف أو أكثر.');
            if (!$('#aTerms').checked) return showErr('لازم توافق على الشروط لتكمل.');
            btn.disabled = true;
            const r = await signUp(name, email, phone, pass);
            authEmail = email.toLowerCase();
            if (r.needsCode) { toast('بعتنالك رمز تأكيد على إيميلك ✉️'); return renderAuth('verify'); }
            return await done(`أهلاً ${name}! حسابك جاهز`);
          }
          if (mode === 'verify') {
            const em = authEmail || val('aEmail'), code = val('aCode');
            if (!XP.isEmail(em)) return showErr('اكتب إيميلك.');
            if (code.replace(/\D/g, '').length < 6) return showErr('اكتب الرمز كامل.');
            btn.disabled = true;
            await XP.verifyCode(em, code, 'signup');
            return await done('تأكد إيميلك ✓ حسابك جاهز');
          }
          if (mode === 'forgot') {
            const em = val('aEmail');
            if (!XP.isEmail(em)) return showErr('اكتب إيميلك صح.');
            btn.disabled = true;
            await XP.sendResetCode(em);
            authEmail = em.toLowerCase(); toast('بعتنالك رمز ✉️');
            return renderAuth('reset');
          }
          if (mode === 'reset') {
            const code = val('aCode'), pass = $('#aPass').value;
            if (code.replace(/\D/g, '').length < 6) return showErr('اكتب الرمز كامل.');
            if (pass.length < 6) return showErr('كلمة السر لازم تكون 6 أحرف أو أكثر.');
            btn.disabled = true;
            await XP.verifyCode(authEmail, code, 'recovery');
            await XP.setNewPassword(pass);
            return await done('تغيّرت كلمة السر ✓');
          }
        } catch (ex) { showErr(errMsg(ex)); btn.disabled = false; }
      });
    }

    /* ---------- wallet ---------- */
    async function renderWallet() {
      await refreshMe();
      const [{ data: tops }, { data: txs }] = await Promise.all([
        sb.from('topups').select('*').order('created_at', { ascending: false }).limit(30),
        sb.from('wallet_tx').select('*').order('created_at', { ascending: false }).limit(50)
      ]);
      const methods = C.PAYMENT_METHODS || [];
      app.innerHTML = `
        <div class="page-head"><div><h1>محفظتي</h1><p>اشحن رصيدك وتابع حركاتك.</p></div></div>
        <div class="stack">
          <div class="wallet-hero"><div><span class="muted">رصيدك الحالي</span><div class="big num">${money(me.balance)}</div></div><span class="muted small">${esc(me.full_name)} · <span class="num">${esc(me.phone)}</span></span></div>
          <div class="grid grid-2">
            <form class="card stack" id="topupForm" novalidate>
              <h2 style="font-size:19px">شحن رصيد</h2>
              <div class="field"><label for="tMethod">طريقة الدفع</label>
                <select id="tMethod">${methods.map((m) => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('')}</select></div>
              <div class="pay-details" id="payDetails"></div>
              <div class="field"><label for="tAmount">المبلغ (${esc(C.CURRENCY || '₪')})</label><input id="tAmount" type="number" inputmode="decimal" min="${C.MIN_TOPUP || 1}" step="any" required dir="ltr" placeholder="${C.MIN_TOPUP || 10}"></div>
              <div class="field"><label for="tRef">رقم العملية / اسم المحوّل</label><input id="tRef" placeholder="اختياري بس بيسرّع المراجعة"></div>
              <div class="field"><label for="tFile">صورة الإيصال</label><input id="tFile" type="file" accept="image/*"><span class="hint">سكرين شوت من التحويل.</span></div>
              <p class="form-msg err" id="tErr" hidden></p>
              <button class="btn btn-primary btn-block" type="submit">أرسل طلب الشحن</button>
            </form>
            <div class="card stack">
              <h2 style="font-size:19px">طلبات الشحن</h2>
              ${(tops || []).length ? `<div class="list">${tops.map((t) => `
                <div class="spread" style="padding:8px 0;border-bottom:1px solid var(--border)">
                  <div><b class="num">${money(t.amount)}</b> <span class="muted small">· ${esc(t.method)}</span><div class="muted small">#${t.id} · ${fmtDate(t.created_at)}${t.admin_note ? ' · ' + esc(t.admin_note) : ''}</div></div>
                  ${pill(t.status, 'topup')}
                </div>`).join('')}</div>` : '<p class="muted small">ما في طلبات شحن لسا.</p>'}
            </div>
          </div>
          <div class="card">
            <h2 style="font-size:19px;margin-bottom:6px">سجل الحركات</h2>
            ${(txs || []).length ? txs.map((x) => `
              <div class="tx"><div><b>${esc(TX_KIND[x.kind] || x.kind)}</b>${x.note ? ` <span class="muted">· ${esc(x.note)}</span>` : ''}<div class="muted small">${fmtDate(x.created_at)}</div></div>
              <span class="amt num ${x.amount > 0 ? 'plus' : 'minus'}">${x.amount > 0 ? '+' : ''}${money(x.amount)}</span></div>`).join('') : '<p class="muted small">ما في حركات لسا.</p>'}
          </div>
        </div>`;
      const showDetails = () => { const m = methods.find((x) => x.id === $('#tMethod').value); $('#payDetails').textContent = m ? m.details : ''; };
      $('#tMethod').addEventListener('change', showDetails); showDetails();
      $('#topupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = $('#tErr'), btn = e.target.querySelector('button[type=submit]');
        const amount = Number($('#tAmount').value), file = $('#tFile').files[0];
        const method = methods.find((x) => x.id === $('#tMethod').value);
        if (!(amount >= (C.MIN_TOPUP || 1))) { err.textContent = `أقل مبلغ للشحن ${money(C.MIN_TOPUP || 1)}.`; err.hidden = false; return; }
        if (file && file.size > 8 * 1024 * 1024) { err.textContent = 'الصورة كبيرة كتير (أكثر من 8MB).'; err.hidden = false; return; }
        btn.disabled = true; btn.textContent = 'جاري الإرسال…'; err.hidden = true;
        try {
          let receipt_path = null;
          if (file) {
            const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
            receipt_path = `${me.id}/${Date.now()}.${ext}`;
            const up = await sb.storage.from('receipts').upload(receipt_path, file, { contentType: file.type || 'image/jpeg' });
            if (up.error) throw up.error;
          }
          const { data: t, error } = await sb.from('topups').insert({ user_id: me.id, amount, method: method ? method.name : '', reference: $('#tRef').value.trim() || null, receipt_path }).select().single();
          if (error) throw error;
          const msg = `مرحباً Explor Plus 👋\nأرسلت طلب شحن رصيد #${t.id}\nالمبلغ: ${money(amount)}\nطريقة الدفع: ${t.method}\nالاسم: ${me.full_name}\nالرقم: ${me.phone}`;
          openSheet(`<h2>✅ وصل طلب الشحن #${t.id}</h2>
            <p class="muted">رح نراجع التحويل ونضيف الرصيد لحسابك بأقرب وقت. لتسريع المراجعة ابعتلنا رسالة:</p>
            <a class="btn btn-wa btn-block" target="_blank" rel="noopener" href="${waLink(C.WA_SUBSCRIPTIONS, msg)}">${WA_ICON} أرسل على واتساب</a>
            <button class="btn btn-ghost btn-block" data-close>تمام</button>`);
          renderWallet();
        } catch (ex) { err.textContent = errMsg(ex); err.hidden = false; btn.disabled = false; btn.textContent = 'أرسل طلب الشحن'; }
      });
    }

    /* ---------- orders ---------- */
    // كم يوم باقي على انتهاء الاشتراك
    const daysLeft = (d) => Math.ceil((new Date(d) - Date.now()) / 86400000);
    const daysWord = (n) => n === 1 ? 'يوم' : n === 2 ? 'يومين' : (n <= 10 ? `${n} أيام` : `${n} يوم`);
    function expiryBadge(o) {
      if (o.status !== 'delivered' || !o.expires_at) return '';
      const n = daysLeft(o.expires_at);
      if (n < 0) return '<span class="badge bad">منتهي</span>';
      if (n === 0) return '<span class="badge bad">بينتهي اليوم</span>';
      return `<span class="badge ${n <= 3 ? 'warn' : ''}">باقي ${daysWord(n)}</span>`;
    }

    let myOrders = [];
    let ordersFilter = 'all';
    async function renderOrders() {
      const [{ data: orders, error }, { data: reports }] = await Promise.all([
        sb.from('orders').select('*, products(category, active)').order('created_at', { ascending: false }).limit(100),
        sb.from('reports').select('*').order('created_at', { ascending: false })
      ]);
      if (error) throw error;
      if (!products.length) { try { await loadProducts(); } catch (e) {} }
      myOrders = orders || [];
      const shown = myOrders.filter((o) => ordersFilter === 'all' || o.status === ordersFilter);
      const cnt = (st) => myOrders.filter((o) => o.status === st).length;
      const repBy = {};
      (reports || []).forEach((r) => { if (!repBy[r.order_id]) repBy[r.order_id] = r; });
      app.innerHTML = `
        <div class="page-head"><div><h1>طلباتي</h1><p>كل مشترياتك وبياناتها بمكان واحد.</p></div></div>
        <div class="chips" role="group" aria-label="فلترة">
          <button class="chip" data-of="all" aria-pressed="${ordersFilter === 'all'}">الكل (${myOrders.length})</button>
          <button class="chip" data-of="delivered" aria-pressed="${ordersFilter === 'delivered'}">مكتملة (${cnt('delivered')})</button>
          <button class="chip" data-of="pending" aria-pressed="${ordersFilter === 'pending'}">قيد التنفيذ (${cnt('pending')})</button>
          ${cnt('refunded') ? `<button class="chip" data-of="refunded" aria-pressed="${ordersFilter === 'refunded'}">مسترجعة (${cnt('refunded')})</button>` : ''}
        </div>
        ${shown.length ? `<div class="list">${shown.map((o) => {
          const rep = repBy[o.id];
          const canRenew = o.status === 'delivered' && o.expires_at && daysLeft(o.expires_at) <= 7 && products.some((p) => p.id === o.product_id);
          return `
          <div class="item">
            <div class="item-head"><div><h3>${esc(o.product_name)}</h3><div class="meta">#${o.id} · ${fmtDate(o.created_at)} · <span class="num">${money(o.price)}</span>${Number(o.discount_pct) > 0 ? ` <span class="saved">وفّرت ${money(Number(o.list_price) - Number(o.price))}</span>` : ''}${o.expires_at && o.status === 'delivered' ? ` · ينتهي ${fmtDate(o.expires_at)}` : ''}</div></div><div class="row">${expiryBadge(o)}${pill(o.status)}</div></div>
            ${o.delivered_content && o.status !== 'refunded' ? secretBox(o.delivered_content) : ''}
            ${o.admin_note ? `<p class="small muted">ملاحظة: ${esc(o.admin_note)}</p>` : ''}
            ${rep ? `<p class="small">${rep.status === 'open' ? '<span class="badge warn">بلاغك قيد المراجعة</span>' : `<span class="badge ${rep.status === 'resolved' ? 'ok' : ''}">${rep.status === 'resolved' ? 'انحلّ البلاغ' : 'تمت مراجعة البلاغ'}</span>`}${rep.admin_reply ? ` <span class="muted">${esc(rep.admin_reply)}</span>` : ''}</p>` : ''}
            <div class="row">
              ${canRenew ? `<button class="btn btn-primary btn-sm" data-buy="${o.product_id}">جدّد الاشتراك</button>` : ''}
              ${o.status === 'delivered' && !(rep && rep.status === 'open') ? `<button class="btn btn-ghost btn-sm" data-report="${o.id}">في مشكلة؟ بلّغ</button>` : ''}
              ${o.status === 'pending' ? `<a class="btn btn-wa btn-sm" target="_blank" rel="noopener" href="${waLink(waFor(o.products), `مرحباً، بستفسر عن طلبي #${o.id} (${o.product_name})`)}">${WA_ICON} استفسر عن الطلب</a>` : ''}
            </div>
          </div>`; }).join('')}</div>` : (myOrders.length ? '<div class="empty">ما في طلبات بهالقسم.</div>' : '<div class="empty">ما عندك طلبات لسا. <a href="#shop" style="color:var(--accent)">تصفّح المتجر</a></div>')}`;
    }

    function openReport(orderId) {
      const o = myOrders.find((x) => x.id === Number(orderId)); if (!o) return;
      const el = openSheet(`
        <div class="spread"><h2>بلاغ عن طلب #${o.id}</h2><button class="btn btn-ghost btn-sm" data-close>إغلاق</button></div>
        <p class="muted">${esc(o.product_name)}. احكيلنا شو المشكلة وبنحلها بأسرع وقت، يا ببديل يا بنرجّعلك المبلغ.</p>
        <div class="chips">${['الحساب ما بيفتح', 'كلمة السر تغيّرت', 'البروفايل مش موجود', 'الاشتراك وقف'].map((t) => `<button type="button" class="chip" data-quick="${esc(t)}">${esc(t)}</button>`).join('')}</div>
        <div class="field"><label for="repMsg">تفاصيل المشكلة</label><textarea id="repMsg" rows="3" placeholder="مثلاً: بيطلع رسالة إنه الحساب موقوف"></textarea></div>
        <p class="form-msg err" id="repErr" hidden></p>
        <button class="btn btn-primary btn-block" id="repSend">أرسل البلاغ</button>`);
      $$('[data-quick]', el).forEach((c) => c.addEventListener('click', () => { $('#repMsg', el).value = c.dataset.quick; }));
      $('#repSend', el).addEventListener('click', async (e) => {
        const btn = e.currentTarget, msg = $('#repMsg', el).value.trim(), err = $('#repErr', el);
        if (msg.length < 3) { err.textContent = 'اكتب شو المشكلة.'; err.hidden = false; return; }
        btn.disabled = true;
        const { error } = await sb.rpc('report_issue', { p_order_id: o.id, p_message: msg });
        if (error) { err.textContent = errMsg(error); err.hidden = false; btn.disabled = false; return; }
        closeSheet(); toast('وصلنا بلاغك، رح نرد عليك بأقرب وقت ✓'); renderOrders();
      });
    }

    /* ---------- notifications ---------- */
    let notes = [];
    async function loadNotes() {
      if (!me) { $('#bellBtn').hidden = true; return; }
      const { data } = await sb.from('notifications').select('*').order('created_at', { ascending: false }).limit(30);
      notes = data || [];
      const unread = notes.filter((n) => !n.is_read).length;
      $('#bellBtn').hidden = false;
      $('#bellCount').hidden = !unread; $('#bellCount').textContent = unread;
    }
    async function openNotes() {
      openSheet(`
        <div class="spread"><h2>الإشعارات</h2><button class="btn btn-ghost btn-sm" data-close>إغلاق</button></div>
        ${notes.length ? `<div class="list">${notes.map((n) => `
          <a class="item note${n.is_read ? '' : ' unread'}" href="${esc(n.link || '#orders')}" data-close>
            <div class="item-head"><h3>${esc(n.title)}</h3><span class="meta">${fmtDate(n.created_at)}</span></div>
            ${n.body ? `<p class="small muted">${esc(n.body)}</p>` : ''}
          </a>`).join('')}</div>` : '<p class="muted">ما في إشعارات لسا.</p>'}`);
      if (notes.some((n) => !n.is_read)) {
        await sb.rpc('mark_notifications_read');
        notes.forEach((n) => { n.is_read = true; });
        $('#bellCount').hidden = true;
      }
    }

    /* ---------- events ---------- */
    document.addEventListener('click', (e) => {
      const f = e.target.closest('[data-filter]'); if (f) { filter = f.dataset.filter; renderShop(); return; }
      const b = e.target.closest('[data-buy]'); if (b) { openBuy(b.dataset.buy); return; }
      const c = e.target.closest('[data-copy]'); if (c) { copy(c.dataset.copy, c); return; }
      const r = e.target.closest('[data-report]'); if (r) { openReport(r.dataset.report); return; }
      const of = e.target.closest('[data-of]'); if (of) { ordersFilter = of.dataset.of; renderOrders(); return; }
      const og = e.target.closest('[data-orders-filter]'); if (og) { ordersFilter = og.dataset.ordersFilter; return; }
      if (e.target.closest('[data-show-tiers]')) { showTiers(); return; }
    });
    $('#bellBtn').addEventListener('click', openNotes);
    // تثبيت التطبيق (أندرويد/كروم: زر مباشر · آيفون: شرح الخطوتين)
    let installEvt = null;
    const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; $('#installBtn').hidden = false; });
    if (isIOS && !standalone) $('#installBtn').hidden = false;
    $('#installBtn').addEventListener('click', async () => {
      if (installEvt) { installEvt.prompt(); const r = await installEvt.userChoice; if (r.outcome === 'accepted') { $('#installBtn').hidden = true; toast('انضاف التطبيق لشاشتك ✓'); } installEvt = null; return; }
      openSheet(`<div class="spread"><h2>📲 ثبّت Explor Plus</h2><button class="btn btn-ghost btn-sm" data-close>إغلاق</button></div>
        <ol class="steps-list"><li>افتح المتجر من <b>Safari</b>.</li><li>اضغط زر <b>المشاركة</b> (المربع والسهم ⬆️) تحت.</li><li>اختار <b>«إضافة إلى الشاشة الرئيسية»</b> ← <b>إضافة</b>.</li></ol>
        <p class="muted small">بيصير عندك أيقونة Explor Plus وبيفتح متل التطبيق.</p>`);
    });
    window.addEventListener('appinstalled', () => { $('#installBtn').hidden = true; });
    setInterval(() => { if (me && !document.hidden) { loadNotes(); } }, 60000);
    $('#logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); me = null; await refreshMe(); location.hash = '#shop'; toast('سجّلت خروج'); });
    window.addEventListener('hashchange', () => { closeSheet(); route(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

    (async () => { await XP.loadSiteConfig(); await refreshMe(); route(); loadNotes(); XP.trackVisits('/store'); })();
  })();
  </script>
  <script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة إدارة Explor Plus</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07080b">
  <link rel="icon" href="assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/store.css">
</head>
<body>
  <header class="top">
    <div class="wrap bar">
      <a class="brand" href="#home"><img src="assets/logo-light.png" alt=""><span>Explor Plus<small>لوحة الإدارة</small></span></a>
      <div class="bar-actions">
        <button class="btn btn-ghost btn-sm" id="refreshBtn" type="button" hidden>تحديث</button>
        <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button" hidden>خروج</button>
      </div>
    </div>
    <nav class="wrap tabs" id="tabs" aria-label="الإدارة" hidden>
      <a class="tab" href="#home" data-route="home">الرئيسية</a>
      <a class="tab" href="#topups" data-route="topups">طلبات الشحن <span class="count" id="cTopups" hidden></span></a>
      <a class="tab" href="#orders" data-route="orders">الطلبات <span class="count" id="cOrders" hidden></span></a>
      <a class="tab" href="#products" data-route="products">المنتجات</a>
      <a class="tab" href="#stock" data-route="stock">المخزون</a>
      <a class="tab" href="#reports" data-route="reports">البلاغات <span class="count" id="cReports" hidden></span></a>
      <a class="tab" href="#customers" data-route="customers">الزباين</a>
      <a class="tab" href="#site" data-route="site">الموقع والعروض</a>
      <a class="tab" href="#settings" data-route="settings">الإعدادات</a>
    </nav>
  </header>

  <main class="wrap" id="app"><div class="spinner"></div></main>

  <script src="assets/vendor/supabase-2.118.0.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/store-core.js"></script>
  <script src="assets/links.js"></script>
  <script>
  (function () {
    const { C, sb, configured, $, $$, esc, intlPhone, money, fmtDate, waLink, errMsg, toast, twoStep, pill, setupNotice, getProfile, signIn } = XP;
    const app = $('#app');
    let me = null;
    let orderFilter = 'pending', topupFilter = 'pending', stockProduct = null, custQuery = '';
    const WA_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>';
    const waCustomer = (p, text) => p && p.phone ? `<a class="btn btn-wa btn-sm" target="_blank" rel="noopener" href="${waLink(intlPhone(p.phone), text)}" aria-label="واتساب">${WA_ICON}</a>` : '';
    const who = (p) => p ? `<b>${esc(p.full_name || '—')}</b><div class="muted small"><span class="num">${esc(p.phone)}</span> ${p.phone_verified ? '<span class="vbadge ok" title="الرقم متأكد منه">✔ موثّق</span>' : (p.phone_verified === false ? '<span class="vbadge" title="ما تأكدنا إنه الرقم لصاحب الحساب">غير موثّق</span>' : '')}</div>` : '—';

    if (!configured) { setupNotice(app); return; }

    function closeSheet() { const s = $('.sheet-bg'); if (s) s.remove(); }
    function openSheet(html) {
      closeSheet();
      const bg = document.createElement('div'); bg.className = 'sheet-bg';
      bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
      bg.addEventListener('click', (e) => { if (e.target === bg || e.target.closest('[data-close]')) closeSheet(); });
      document.body.appendChild(bg);
      return bg.firstElementChild;
    }
    const fail = (e) => toast(errMsg(e), 'err');

    /* ---------- auth ---------- */
    function renderLogin(msg) {
      $('#tabs').hidden = true; $('#logoutBtn').hidden = !me; $('#refreshBtn').hidden = true;
      app.innerHTML = `<form class="auth card stack" id="loginForm" novalidate>
        <h1 style="font-size:22px">دخول الإدارة</h1>
        ${msg ? `<p class="form-msg err">${esc(msg)}</p>` : ''}
        <div class="field"><label for="lPhone">رقم الواتساب</label><input id="lPhone" type="tel" inputmode="tel" autocomplete="username" dir="ltr" required placeholder="059xxxxxxx"></div>
        <div class="field"><label for="lPass">كلمة السر</label><input id="lPass" type="password" autocomplete="current-password" dir="ltr" required></div>
        <p class="form-msg err" id="lErr" hidden></p>
        <button class="btn btn-primary btn-block" type="submit">دخول</button>
      </form>`;
      $('#loginForm').addEventListener('submit', async (e) => {
        e.preventDefault(); const err = $('#lErr');
        try { await signIn($('#lPhone').value, $('#lPass').value); await boot(); }
        catch (ex) { err.textContent = errMsg(ex); err.hidden = false; }
      });
    }

    async function boot() {
      try { me = await getProfile(); } catch (e) { me = null; }
      if (!me) return renderLogin();
      if (!me.is_admin) { await sb.auth.signOut(); me = null; return renderLogin('هالحساب مش أدمن. لازم تفعّله من Supabase (شوف ملف README).'); }
      $('#tabs').hidden = false; $('#logoutBtn').hidden = false; $('#refreshBtn').hidden = false;
      updateCounts(); route();
    }

    async function updateCounts() {
      if (!me) return;
      const [t, o, r] = await Promise.all([
        sb.from('topups').select('id', { count: 'exact', head: true }).eq('status', 'pending'),
        sb.from('orders').select('id', { count: 'exact', head: true }).eq('status', 'pending'),
        sb.from('reports').select('id', { count: 'exact', head: true }).eq('status', 'open')
      ]);
      const set = (el, n) => { el.hidden = !n; el.textContent = n || ''; };
      set($('#cTopups'), t.count); set($('#cOrders'), o.count); set($('#cReports'), r.count);
      return { topups: t.count || 0, orders: o.count || 0, reports: r.count || 0 };
    }

    /* ---------- router ---------- */
    async function route() {
      if (!me) return;
      const r = (location.hash || '#home').slice(1);
      $$('[data-route]').forEach((a) => { if (a.dataset.route === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
      app.innerHTML = '<div class="spinner"></div>';
      try {
        if (r === 'topups') return await renderTopups();
        if (r === 'orders') return await renderOrders();
        if (r === 'products') return await renderProducts();
        if (r === 'stock') return await renderStock();
        if (r === 'customers') return await renderCustomers();
        if (r === 'reports') return await renderReports();
        if (r === 'settings') return await renderSettings();
        if (r === 'site') return await renderSite();
        return await renderHome();
      } catch (e) { app.innerHTML = `<div class="empty">${esc(errMsg(e))}</div>`; }
    }

    /* ---------- home ---------- */
    let trafficTimer = null;
    async function loadTraffic() {
      if (!$('#tNow')) { clearInterval(trafficTimer); trafficTimer = null; return; }
      const { data, error } = await sb.rpc('admin_traffic');
      if (error) { $('#trafficTiles').innerHTML = '<p class="muted small">عداد الزيارات بحاجة تحديث قاعدة البيانات (ملف update-2026-11-traffic.sql).</p>'; clearInterval(trafficTimer); trafficTimer = null; return; }
      const t = (data && data[0]) || {};
      $('#tNow').textContent = t.active_now ?? 0; $('#tStore').textContent = t.store_now ?? 0;
      $('#tToday').textContent = `${t.visits_today ?? 0}`; $('#tToday').title = `${t.visitors_today ?? 0} زائر مختلف`;
      $('#tWeek').textContent = t.visits_7d ?? 0;
    }

    let auditLimit = 15;
    async function loadAudit() {
      const box = $('#auditList'); if (!box) return;
      const { data, error } = await sb.from('audit_log').select('*').order('at', { ascending: false }).limit(auditLimit);
      if (error) { box.innerHTML = '<p class="muted small">سجل العمليات بحاجة تحديث قاعدة البيانات (ملف update-2026-11-alerts.sql).</p>'; $('#auditMore').hidden = true; return; }
      $('#auditMore').hidden = data.length < auditLimit;
      box.innerHTML = data.length ? data.map((a) => `<div style="padding:8px 0;border-bottom:1px solid var(--border)${a.critical ? ';border-inline-start:3px solid var(--bad);padding-inline-start:10px' : ''}">
          <div class="spread" style="gap:8px;align-items:flex-start"><b style="font-size:14.5px">${esc(a.action)}</b><span class="small muted num" dir="ltr" style="white-space:nowrap">${new Date(a.at).toLocaleString('en-GB', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).replace(',', ' ·')}</span></div>
          ${a.details ? `<div class="small muted" style="white-space:pre-line">${esc(a.details)}</div>` : ''}
          <div class="small" style="color:${a.actor_label.startsWith('⚠️') ? 'var(--bad)' : 'var(--muted)'}">${esc(a.actor_label)}</div>
        </div>`).join('') : '<p class="muted small">ما في عمليات لسا.</p>';
    }
    async function renderHome() {
      const start = new Date(); start.setHours(0, 0, 0, 0);
      const soon = new Date(Date.now() + 7 * 86400000).toISOString();
      const [counts, users, today, stockRes, prods, exp] = await Promise.all([
        updateCounts(),
        sb.from('profiles').select('id', { count: 'exact', head: true }),
        sb.from('orders').select('price, status').gte('created_at', start.toISOString()),
        sb.rpc('product_stock'),
        sb.from('products').select('id, name, delivery, active').eq('delivery', 'auto').eq('active', true),
        sb.from('orders').select('id, product_name, expires_at, profiles(full_name, phone)').eq('status', 'delivered').gte('expires_at', new Date().toISOString()).lte('expires_at', soon).order('expires_at').limit(50)
      ]);
      const expiring = exp.data || [];
      const sales = (today.data || []).filter((o) => o.status !== 'refunded');
      const stockMap = Object.fromEntries((stockRes.data || []).map((r) => [r.product_id, Number(r.available)]));
      const low = (prods.data || []).filter((p) => (stockMap[p.id] || 0) < 3);
      app.innerHTML = `
        <div class="page-head"><div><h1>أهلاً ${esc(me.full_name)} 👋</h1><p>ملخص اليوم.</p></div><button class="btn btn-ghost" type="button" data-backup>⬇ تنزيل نسخة احتياطية</button></div>
        <p class="muted small" style="margin:-8px 0 14px">نزّل نسخة كل أسبوع وخزّنها بـ Google Drive. فيها الزباين والأرصدة والطلبات والمخزون.</p>
        <div class="grid grid-4" id="trafficTiles" style="margin-bottom:14px">
          <div class="stat"><b class="num" id="tNow">…</b><span><i class="live-dot" aria-hidden="true"></i>نشط بالموقع الآن</span></div>
          <div class="stat"><b class="num" id="tStore">…</b><span>منهم بالمتجر</span></div>
          <div class="stat"><b class="num" id="tToday">…</b><span>زيارات اليوم</span></div>
          <div class="stat"><b class="num" id="tWeek">…</b><span>زيارات آخر 7 أيام</span></div>
        </div>
        <div class="grid grid-4">
          <a class="stat" href="#topups"><b class="num">${counts.topups}</b><span>طلبات شحن بانتظارك</span></a>
          <a class="stat" href="#orders"><b class="num">${counts.orders}</b><span>طلبات قيد التنفيذ</span></a>
          <div class="stat"><b class="num">${money(sales.reduce((s, o) => s + Number(o.price), 0))}</b><span>مبيعات اليوم (${sales.length} طلب)</span></div>
          <a class="stat" href="#customers"><b class="num">${users.count || 0}</b><span>زبون مسجّل</span></a>
        </div>
        <div class="card" style="margin-top:14px">
          <h2 style="font-size:18px;margin-bottom:10px">مخزون قرّب يخلص</h2>
          ${low.length ? low.map((p) => `<div class="spread" style="padding:8px 0;border-bottom:1px solid var(--border)"><span>${esc(p.name)}</span><span class="row"><span class="badge ${(stockMap[p.id] || 0) ? 'warn' : 'bad'}">${stockMap[p.id] || 0} متبقي</span><a class="btn btn-ghost btn-sm" href="#stock" data-stock-go="${p.id}">إضافة</a></span></div>`).join('') : '<p class="muted small">كل المخزون تمام.</p>'}
        </div>
        ${counts.reports ? `<a class="renew-banner" href="#reports" style="margin-top:14px"><span>🚨 عندك <b>${counts.reports}</b> بلاغ مفتوح</span><span class="btn btn-primary btn-sm">افتح البلاغات</span></a>` : ''}
        <div class="card" style="margin-top:14px">
          <h2 style="font-size:18px;margin-bottom:4px">اشتراكات بتخلص خلال 7 أيام</h2>
          <p class="muted small" style="margin-bottom:8px">ذكّر الزبون يجدد. الموقع كمان بيبعتله إشعار تلقائي قبل 3 أيام.</p>
          ${expiring.length ? expiring.map((o) => {
            const n = Math.ceil((new Date(o.expires_at) - Date.now()) / 86400000);
            return `<div class="spread" style="padding:8px 0;border-bottom:1px solid var(--border)"><span>${who(o.profiles)}<span class="small muted">${esc(o.product_name)} · #${o.id}</span></span><span class="row"><span class="badge ${n <= 3 ? 'warn' : ''}">باقي ${n} ${n === 1 ? 'يوم' : 'أيام'}</span>${waCustomer(o.profiles, `مرحباً ${o.profiles?.full_name || ''} 👋\nاشتراك ${o.product_name} تبعك بيخلص بعد ${n} ${n === 1 ? 'يوم' : 'أيام'}.\nجدّده من المتجر بضغطة، أو رد علينا هون ومنجددلك 🙏`)}</span></div>`;
          }).join('') : '<p class="muted small">ما في اشتراكات بتخلص هالأسبوع.</p>'}
        </div>
        <div class="card" style="margin-top:14px">
          <div class="spread"><h2 style="font-size:18px">🕵️ سجل العمليات</h2><button class="btn btn-ghost btn-sm" type="button" id="auditMore">عرض أكتر</button></div>
          <p class="muted small" style="margin:4px 0 8px">كل تعديل بالمتجر مين عمله ومتى. نفس الشي بيوصلك فوراً على بوت تلجرام. ما حدا بيقدر يحذف منه شي.</p>
          <div id="auditList"><p class="muted small">جاري التحميل…</p></div>
        </div>`;
      auditLimit = 15; loadAudit();
      $('#auditMore').addEventListener('click', () => { auditLimit += 30; loadAudit(); });
      loadTraffic(); if (!trafficTimer) trafficTimer = setInterval(loadTraffic, 20000);
    }

    /* ---------- topups ---------- */
    async function renderTopups() {
      let q = sb.from('topups').select('*, profiles(full_name, phone, balance)').order('created_at', { ascending: topupFilter === 'pending' }).limit(100);
      if (topupFilter !== 'all') q = q.eq('status', topupFilter);
      const { data, error } = await q; if (error) throw error;
      const paths = (data || []).map((t) => t.receipt_path).filter(Boolean);
      let urls = {};
      if (paths.length) {
        const { data: s } = await sb.storage.from('receipts').createSignedUrls(paths, 3600);
        (s || []).forEach((x) => { if (x.signedUrl) urls[x.path] = x.signedUrl; });
      }
      app.innerHTML = `
        <div class="page-head"><div><h1>طلبات الشحن</h1><p>تأكد من وصول التحويل قبل الموافقة. بتقدر تعدّل المبلغ إذا وصلك مبلغ مختلف.</p></div></div>
        <div class="chips">${['pending:بانتظار المراجعة', 'approved:مقبولة', 'rejected:مرفوضة', 'all:الكل'].map((x) => { const [k, l] = x.split(':'); return `<button class="chip" data-tf="${k}" aria-pressed="${topupFilter === k}">${l}</button>`; }).join('')}</div>
        ${(data || []).length ? `<div class="list">${data.map((t) => `
          <div class="item" data-topup="${t.id}">
            <div class="item-head">
              <div>${who(t.profiles)}<div class="meta">#${t.id} · ${fmtDate(t.created_at)}</div></div>
              <div class="row">${pill(t.status, 'topup')}${waCustomer(t.profiles, t.status === 'approved' ? `مرحباً ${t.profiles?.full_name || ''} 👋\nتم شحن رصيدك بمبلغ ${money(t.amount)} ✅\nبتقدر تشتري هلأ من المتجر.` : '')}</div>
            </div>
            <div class="row small"><span class="badge">${esc(t.method)}</span><b class="num">${money(t.amount)}</b>${t.reference ? `<span class="muted">المحوّل: <b>${esc(t.reference)}</b></span>` : ''}${t.receipt_path && urls[t.receipt_path] ? `<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="${esc(urls[t.receipt_path])}">عرض الإيصال</a>` : '<span class="muted">بدون إيصال</span>'}</div>
            ${t.admin_note ? `<p class="small muted">ملاحظة: ${esc(t.admin_note)}</p>` : ''}
            ${t.status === 'pending' ? `
              <div class="row">
                <input class="input" style="max-width:140px" type="number" step="any" dir="ltr" value="${t.amount}" data-amount aria-label="المبلغ المعتمد">
                <button class="btn btn-ok btn-sm" data-approve="${t.id}">موافقة وإضافة الرصيد</button>
                <input class="input" style="max-width:220px" placeholder="سبب الرفض (اختياري)" data-note aria-label="سبب الرفض">
                <button class="btn btn-bad btn-sm" data-reject="${t.id}">رفض</button>
              </div>` : ''}
          </div>`).join('')}</div>` : '<div class="empty">ما في طلبات هون.</div>'}`;
    }

    /* ---------- orders ---------- */
    async function renderOrders() {
      let q = sb.from('orders').select('*, profiles(full_name, phone)').order('created_at', { ascending: orderFilter === 'pending' }).limit(150);
      if (orderFilter !== 'all') q = q.eq('status', orderFilter);
      const { data, error } = await q; if (error) throw error;
      app.innerHTML = `
        <div class="page-head"><div><h1>الطلبات</h1><p>الاشتراكات التلقائية بتتسلّم لحالها. الخدمات اليدوية بتسلّمها من هون.</p></div></div>
        <div class="chips">${['pending:قيد التنفيذ', 'delivered:تم التسليم', 'refunded:مسترجعة', 'all:الكل'].map((x) => { const [k, l] = x.split(':'); return `<button class="chip" data-of="${k}" aria-pressed="${orderFilter === k}">${l}</button>`; }).join('')}</div>
        ${(data || []).length ? `<div class="list">${data.map((o) => `
          <div class="item" data-order="${o.id}">
            <div class="item-head">
              <div><h3>${esc(o.product_name)} · <span class="num">${money(o.price)}</span></h3><div class="meta">#${o.id} · ${fmtDate(o.created_at)}</div></div>
              <div class="row">${pill(o.status)}${waCustomer(o.profiles, o.status === 'delivered' ? `مرحباً ${o.profiles?.full_name || ''} 👋\nطلبك #${o.id} (${o.product_name}) جاهز ✅\nبتلاقي التفاصيل بصفحة "طلباتي" بالمتجر.` : `مرحباً ${o.profiles?.full_name || ''} 👋\nبخصوص طلبك #${o.id} (${o.product_name}):`)}</div>
            </div>
            <div class="small">${who(o.profiles)}</div>
            ${o.customer_note ? `<p class="small"><span class="muted">ملاحظة الزبون:</span> ${esc(o.customer_note)}</p>` : ''}
            ${o.delivered_content ? `<div class="secret"><code>${esc(o.delivered_content)}</code></div>` : ''}
            ${o.status === 'pending' ? `<div class="field"><textarea rows="2" placeholder="اللي بدك يوصل للزبون (بيانات الحساب، رابط، ملاحظة…)" data-content aria-label="محتوى التسليم"></textarea></div>` : ''}
            ${o.status !== 'refunded' ? `<div class="row">
              ${o.status === 'pending' ? `<button class="btn btn-ok btn-sm" data-deliver="${o.id}">تسليم الطلب</button>` : ''}
              <input class="input" style="max-width:220px" placeholder="سبب الاسترجاع (اختياري)" data-note aria-label="سبب الاسترجاع">
              <button class="btn btn-bad btn-sm" data-refund="${o.id}">استرجاع المبلغ للزبون</button>
            </div>` : (o.admin_note ? `<p class="small muted">سبب الاسترجاع: ${esc(o.admin_note)}</p>` : '')}
          </div>`).join('')}</div>` : '<div class="empty">ما في طلبات هون.</div>'}`;
    }

    /* ---------- products ---------- */
    let productsCache = [];
    async function renderProducts() {
      const [{ data, error }, { data: s }] = await Promise.all([sb.from('products').select('*').order('sort').order('id'), sb.rpc('product_stock')]);
      if (error) throw error;
      productsCache = data || [];
      const stockMap = Object.fromEntries((s || []).map((r) => [r.product_id, Number(r.available)]));
      app.innerHTML = `
        <div class="page-head"><div><h1>المنتجات</h1><p>الاشتراكات والخدمات اللي بتظهر بالمتجر.</p></div><button class="btn btn-primary" data-edit="new">+ منتج جديد</button></div>
        ${productsCache.length ? `<div class="table-wrap"><table>
          <thead><tr><th>المنتج</th><th>القسم</th><th>السعر</th><th>التسليم</th><th>المخزون</th><th>الحالة</th><th></th></tr></thead>
          <tbody>${productsCache.map((p) => `<tr>
            <td><b>${esc(p.name)}</b>${p.duration ? `<div class="muted small">${esc(p.duration)}</div>` : ''}</td>

    /* ---------- stock ---------- */
    async function renderStock() {
      const [{ data: prods }, { data: s }] = await Promise.all([sb.from('products').select('id, name, duration').eq('delivery', 'auto').order('sort').order('id'), sb.rpc('product_stock')]);

      if (!(prods || []).length) { app.innerHTML = '<div class="empty">ما في منتجات بتسليم تلقائي. ضيف منتج من تبويب المنتجات واختار "تلقائي من المخزون".</div>'; return; }
      if (!stockProduct || !prods.find((p) => p.id === stockProduct)) stockProduct = prods[0].id;
      const { data: items } = await sb.from('stock_items').select('id, content, created_at').eq('product_id', stockProduct).eq('is_sold', false).order('id').limit(300);
      app.innerHTML = `
        <div class="page-head"><div><h1>المخزون</h1><p>كل سطر = حساب واحد بينسلّم لزبون واحد تلقائياً لما يشتري.</p></div></div>

            <div class="field"><label for="sLines">الحسابات / الأكواد</label><textarea id="sLines" rows="8" dir="ltr" placeholder="email1@mail.com : pass123 : Profile 2&#10;email2@mail.com : pass456 : Profile 3"></textarea><span class="hint">سطر لكل حساب. اكتب بكل سطر كل اللي بيحتاجه الزبون.</span></div>

          </form>
          <div class="card stack">
            <div class="spread"><h2 style="font-size:18px">متوفر حالياً</h2><span class="badge ${(stockMap[stockProduct] || 0) ? 'ok' : 'bad'}">${stockMap[stockProduct] || 0}</span></div>
            ${(items || []).length ? `<div class="list">${items.map((i) => `<div class="secret"><code>${esc(i.content)}</code><button class="btn btn-bad btn-sm" data-del-stock="${i.id}">حذف</button></div>`).join('')}</div>` : '<p class="muted small">المخزون فاضي لهالمنتج.</p>'}
          </div>
        </div>`;

      $('#offerForm').addEventListener('submit', async (e) => {

    function syncLinks() {
      $$('[data-link]').forEach((row) => { const l = linkDraft[Number(row.dataset.link)]; if (l) { l.type = $('[data-l-type]', row).value; l.title = $('[data-l-title]', row).value; l.sub = $('[data-l-sub]', row).value; l.value = $('[data-l-val]', row).value; l.featured = $('[data-l-feat]', row).checked; } });

    }

    /* ---------- customers ---------- */
    async function renderCustomers() {
      let q = sb.from('profiles').select('*').order('created_at', { ascending: false }).limit(60);
      const term = custQuery.replace(/[%,()]/g, '').trim();
      if (term) q = q.or(`phone.ilike.%${term}%,full_name.ilike.%${term}%`);
      const [{ data, error }, { data: spentRows }, { data: tierRows }] = await Promise.all([q, sb.rpc('admin_customer_spent'), sb.from('loyalty_tiers').select('*').order('min_spent', { ascending: false })]);
      if (error) throw error;
      const spentBy = Object.fromEntries((spentRows || []).map((r) => [r.user_id, r]));
      const tierOf = (n) => (tierRows || []).find((t) => n >= Number(t.min_spent));
      app.innerHTML = `
        <div class="page-head"><div><h1>الزباين</h1><p>ابحث بالاسم أو الرقم. «توثيق الرقم» بعد ما تحكي مع الزبون عالواتساب وتتأكد إنه الرقم إله.</p></div></div>
        <form class="row" id="cSearch" style="margin-bottom:14px"><input class="input" id="cQ" style="max-width:320px" placeholder="بحث…" value="${esc(custQuery)}" aria-label="بحث"><button class="btn btn-ghost" type="submit">بحث</button></form>
        ${(data || []).length ? `<div class="table-wrap"><table>

          <tbody>${data.map((p) => { const sp = Number((spentBy[p.id] || {}).total_spent || 0), tr = tierOf(sp); return `<tr>
            <td>${who(p)}${p.is_admin ? ' <span class="badge info">أدمن</span>' : ''}</td>
            <td class="num"><b>${money(p.balance)}</b></td>
            <td class="num">${money(sp)} <span class="muted small">(${(spentBy[p.id] || {}).orders_count || 0} طلب)</span></td>
            <td>${tr ? `<span class="badge warn">⭐ ${esc(tr.name)} · ${Number(tr.discount_pct)}%</span>` : '<span class="muted small">—</span>'}</td>
            <td class="small muted">${fmtDate(p.created_at)}</td>
            <td><div class="row"><button class="btn btn-ghost btn-sm" data-adjust="${p.id}" data-name="${esc(p.full_name)}">تعديل الرصيد</button><button class="btn btn-ghost btn-sm" data-verify="${p.id}" data-on="${p.phone_verified ? 1 : 0}">${p.phone_verified ? 'إلغاء التوثيق' : 'توثيق الرقم'}</button><button class="btn btn-ghost btn-sm" data-pass="${p.id}" data-name="${esc(p.full_name)}">كلمة سر جديدة</button>${waCustomer(p, `مرحباً ${p.full_name} 👋`)}</div></td>
          </tr>`; }).join('')}</tbody></table></div>` : '<div class="empty">ما في نتائج.</div>'}`;
      $('#cSearch').addEventListener('submit', (e) => { e.preventDefault(); custQuery = $('#cQ').value; renderCustomers(); });
    }

    function setPassword(id, name) {
      const el = openSheet(`
        <div class="spread"><h2>كلمة سر جديدة لـ ${esc(name)}</h2><button class="btn btn-ghost btn-sm" data-close>إغلاق</button></div>
        <p class="muted small">تأكد إنه اللي طالب التغيير هو صاحب الحساب (رسالة من نفس رقمه).</p>
        <form class="stack" id="pwForm" novalidate>
          <div class="field"><label for="pwNew">كلمة السر الجديدة</label><input id="pwNew" dir="ltr" autocomplete="off" minlength="6" required></div>
          <button class="btn btn-ghost btn-sm" type="button" id="pwGen" style="justify-self:start">اقترح كلمة سر</button>
          <p class="form-msg err" id="pwErr" hidden></p>
          <button class="btn btn-primary" type="submit">حفظ</button>
        </form>`);
      $('#pwGen', el).addEventListener('click', () => { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let x = ''; const r = crypto.getRandomValues(new Uint32Array(8)); r.forEach((n) => { x += a[n % a.length]; }); $('#pwNew', el).value = x; });
      $('#pwForm', el).addEventListener('submit', async (e) => {
        e.preventDefault(); const pw = $('#pwNew', el).value.trim(), err = $('#pwErr', el);
        if (pw.length < 6) { err.textContent = 'كلمة السر لازم تكون 6 أحرف أو أكثر.'; err.hidden = false; return; }
        const { error } = await sb.rpc('admin_set_password', { p_user_id: id, p_password: pw });
        if (error) { err.textContent = errMsg(error); err.hidden = false; return; }
        closeSheet(); toast('تغيّرت كلمة السر ✓ ابعتها للزبون على واتساب');
      });
    }

    async function exportBackup(btn) {
      btn.disabled = true; const old = btn.textContent; btn.textContent = 'جاري التجهيز…';
      try {
        const tables = ['profiles', 'products', 'stock_items', 'orders', 'topups', 'wallet_tx', 'reports', 'loyalty_tiers', 'site_config', 'announcements', 'notifications'];
        const out = { exported_at: new Date().toISOString(), site: location.origin, tables: {} };
        for (const tb of tables) {
          let all = [], from = 0;
          for (;;) {
            const { data, error } = await sb.from(tb).select('*').range(from, from + 999);
            if (error) throw error;
            all = all.concat(data || []);
            if (!data || data.length < 1000) break;
            from += 1000;
          }
          out.tables[tb] = all;
        }
        const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `explorplus-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        toast('انحفظت النسخة الاحتياطية ✓ خزّنها بمكان آمن (Google Drive مثلاً)');
      } catch (e) { fail(e); }
      btn.disabled = false; btn.textContent = old;
    }

    function adjustBalance(id, name) {
      const el = openSheet(`
        <div class="spread"><h2>تعديل رصيد ${esc(name)}</h2><button class="btn btn-ghost btn-sm" data-close>إغلاق</button></div>
        <form class="stack" id="aForm" novalidate>
          <div class="field"><label for="aAmt">المبلغ</label><input id="aAmt" type="number" step="any" dir="ltr" required placeholder="20 للإضافة، ‎-20 للخصم"></div>
          <div class="field"><label for="aNote">السبب</label><input id="aNote" placeholder="مثلاً: تعويض، هدية، تصحيح"></div>
          <p class="form-msg err" id="aErr" hidden></p>
          <button class="btn btn-primary" type="submit">حفظ</button>
        </form>`);
      $('#aForm', el).addEventListener('submit', async (e) => {
        e.preventDefault(); const amt = Number($('#aAmt', el).value), err = $('#aErr', el);
        if (!amt) { err.textContent = 'اكتب مبلغ غير صفر.'; err.hidden = false; return; }
        const { error } = await sb.rpc('admin_adjust_balance', { p_user_id: id, p_amount: amt, p_note: $('#aNote', el).value.trim() || null });
        if (error) { err.textContent = error.message.includes('balance_check') || error.message.includes('check constraint') ? 'الرصيد ما بيصير بالسالب.' : errMsg(error); err.hidden = false; return; }
        closeSheet(); toast('انعدّل الرصيد ✓'); renderCustomers();
      });
    }

    /* ---------- events ---------- */
    document.addEventListener('click', async (e) => {
      const t = e.target.closest('button, a'); if (!t) return;
      const d = t.dataset;
      if (d.tf) { topupFilter = d.tf; return renderTopups(); }
      if (d.of) { orderFilter = d.of; return renderOrders(); }
      if (d.edit) return editProduct(d.edit === 'new' ? null : d.edit);
      if (d.stockGo) { stockProduct = Number(d.stockGo); return; }
      if (d.adjust) return adjustBalance(d.adjust, d.name);
      if (d.pass) return setPassword(d.pass, d.name);
      if (d.backup !== undefined) return exportBackup(t);
      if (d.verify) {
        const { error } = await sb.rpc('admin_set_phone_verified', { p_user_id: d.verify, p_verified: d.on !== '1' });
        if (error) return fail(error);
        toast(d.on === '1' ? 'انلغى توثيق الرقم' : 'الرقم صار موثّق ✓'); return renderCustomers();
      }
      if (d.approve) {
        const box = t.closest('[data-topup]'); const amt = Number($('[data-amount]', box).value);
        t.disabled = true;
        const { error } = await sb.rpc('admin_approve_topup', { p_topup_id: Number(d.approve), p_amount: amt });
        if (error) { t.disabled = false; return fail(error); }
        toast(`انضاف ${money(amt)} لرصيد الزبون ✓`); updateCounts(); return renderTopups();
      }
      if (d.reject) return twoStep(t, async () => {
        const box = t.closest('[data-topup]');
        const { error } = await sb.rpc('admin_reject_topup', { p_topup_id: Number(d.reject), p_note: $('[data-note]', box).value.trim() || null });
        if (error) return fail(error);
        toast('انرفض الطلب'); updateCounts(); renderTopups();
      });
      if (d.deliver) {
        const box = t.closest('[data-order]'); const content = $('[data-content]', box).value.trim();
        if (!content) return toast('اكتب شو بدك يوصل للزبون أول', 'err');
        t.disabled = true;
        const { error } = await sb.rpc('admin_deliver_order', { p_order_id: Number(d.deliver), p_content: content });
        if (error) { t.disabled = false; return fail(error); }
        toast('انسلّم الطلب ✓'); updateCounts(); return renderOrders();
      }
      if (d.refund) return twoStep(t, async () => {
        const box = t.closest('[data-order]');
        const { error } = await sb.rpc('admin_refund_order', { p_order_id: Number(d.refund), p_note: $('[data-note]', box).value.trim() || null });
        if (error) return fail(error);
        toast('رجع المبلغ لرصيد الزبون ✓'); updateCounts(); renderOrders();
      });
      if (d.rf) { reportFilter = d.rf; return renderReports(); }
      if (d.linkDel !== undefined) { syncLinks(); linkDraft.splice(Number(d.linkDel), 1); return drawLinks(); }
      if (d.linkMove !== undefined) {
        syncLinks(); const i = Number(d.linkMove), j = i + Number(d.dir);
        if (j >= 0 && j < linkDraft.length) [linkDraft[i], linkDraft[j]] = [linkDraft[j], linkDraft[i]];
        return drawLinks();
      }
      if (d.payDel !== undefined) { syncPay(); payDraft.splice(Number(d.payDel), 1); return drawPay(); }
      if (d.annToggle) {
        const { error } = await sb.from('announcements').update({ active: d.on !== '1' }).eq('id', Number(d.annToggle));
        if (error) return fail(error);
        return renderSite();
      }
      if (d.annDel) return twoStep(t, async () => {
        const { error } = await sb.from('announcements').delete().eq('id', Number(d.annDel));
        if (error) return fail(error);
        toast('انحذف العرض'); renderSite();
      });
      if (d.tierSave) {
        const row = t.closest('[data-tier]');
        const rec = { name: $('[data-t-name]', row).value.trim(), min_spent: Number($('[data-t-min]', row).value), discount_pct: Number($('[data-t-pct]', row).value) };
        if (!rec.name || !(rec.min_spent > 0) || !(rec.discount_pct > 0 && rec.discount_pct < 100)) return toast('عبّي الاسم والمبلغ والخصم (بين 0 و 100)', 'err');
        const res = d.tierSave === 'new' ? await sb.from('loyalty_tiers').insert(rec) : await sb.from('loyalty_tiers').update(rec).eq('id', Number(d.tierSave));
        if (res.error) return toast(res.error.message.includes('duplicate') ? 'في مستوى بنفس المبلغ.' : errMsg(res.error), 'err');
        toast('انحفظ المستوى ✓'); return renderSettings();
      }
      if (d.tierDel) return twoStep(t, async () => {
        const { error } = await sb.from('loyalty_tiers').delete().eq('id', Number(d.tierDel));
        if (error) return fail(error);
        toast('انحذف المستوى'); renderSettings();
      });
      if (d.showManual !== undefined) { const box = t.closest('[data-report-box]'); $('[data-manual]', box).hidden = false; $('[data-content]', box).focus(); return; }
      if (d.resolve) {
        const box = t.closest('[data-report-box]'); const id = Number(box.dataset.reportBox);
        const reply = $('[data-reply]', box).value.trim() || null;
        const content = d.resolve === 'content' ? $('[data-content]', box).value.trim() : null;
        if (d.resolve === 'content' && !content) return toast('اكتب البيانات الجديدة أول', 'err');
        const go = async () => {
          t.disabled = true;
          const { error } = await sb.rpc('admin_resolve_report', { p_report_id: id, p_mode: d.resolve, p_content: content, p_reply: reply });
          if (error) { t.disabled = false; return fail(error); }
          toast(d.resolve === 'stock' || d.resolve === 'content' ? 'انسلّم البديل للزبون ✓' : 'انسكّر البلاغ ✓'); updateCounts(); renderReports();
        };
        return d.resolve === 'reject' ? twoStep(t, go) : go();
      }
      if (d.refundReport) return twoStep(t, async () => {
        const box = t.closest('[data-report-box]'); const id = Number(box.dataset.reportBox);
        const reply = $('[data-reply]', box).value.trim() || 'رجعنالك المبلغ على رصيدك.';
        const r1 = await sb.rpc('admin_refund_order', { p_order_id: Number(d.refundReport), p_note: 'بلاغ #' + id });
        if (r1.error) return fail(r1.error);
        const r2 = await sb.rpc('admin_resolve_report', { p_report_id: id, p_mode: 'reply', p_reply: reply });
        if (r2.error) return fail(r2.error);
        toast('رجع المبلغ لرصيد الزبون وانسكّر البلاغ ✓'); updateCounts(); renderReports();
      });
      if (d.delStock) return twoStep(t, async () => {
        const { error } = await sb.from('stock_items').delete().eq('id', Number(d.delStock)).eq('is_sold', false);
        if (error) return fail(error);
        toast('انحذف'); renderStock();
      });
    });
    $('#logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); me = null; renderLogin(); });
    $('#refreshBtn').addEventListener('click', () => { updateCounts(); route(); });
    window.addEventListener('hashchange', () => { closeSheet(); route(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
    setInterval(updateCounts, 30000);

    XP.loadSiteConfig().finally(boot);
  })();
  </script>
</body>
</html>
